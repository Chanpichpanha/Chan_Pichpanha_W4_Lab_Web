<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body {
        margin: 0;
        padding: 0;
      }

      .main {
        height: 100vh;
        background-color: #25384B;
        display: flex;
        flex-direction: row;
        padding: 3em;
        gap: 3em;
      }

      .left-section {
        background-color: #A3CFCC;
        flex-grow: 1;
        padding: 2em;
      }

      .right-section {
        background-color: #F7CFB6;
        width: 20em;
        display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 2em;
      }

      .item {
        background-color: #86C2DE;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
