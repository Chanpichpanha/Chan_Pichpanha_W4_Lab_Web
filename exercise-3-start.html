<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>

        body {
            margin: 0;
            padding: 1rem;
            background-color: white;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header {
            background-color: #1e90ff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px #0077ea;
        }

        .combine {
            display: flex;
            flex-direction: row;
            gap: 16px;
            flex-grow: 1;
        }
        
        main {
            background-color: #3cb371;
            border-radius: 8px;
            box-shadow: 0 4px 6px #2f8d59;
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store_item {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .item {
            background-color: #2f8d59;
            border-radius: 8px;
            box-shadow: 0 2px 4px #226741;
            width: calc((100% - 3rem) / 4);
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            background-color: #ff6347;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px #e02200;
            width: 12rem;
            padding: 1rem;
            flex-shrink: 0;
        }

        footer {
            background-color: #4169e1;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px #1d44b8;
        }
    </style>
</head>
<body>
    <header>Header</header>

    <div class="combine">
        <main>
            <div>main</div>
            <div class="store_item">
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </div>
        </main>

        <aside class="sidebar">sidebar</aside>
    </div>

    <footer>footer</footer>
</body>
</html>
